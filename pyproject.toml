[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadgcl"
version = "0.1.0"
description = "B-rep graph contrastive learning for CAD model retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "torch-geometric>=2.5.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "typer>=0.9.0",
    "faiss-cpu>=1.8.0",
    "streamlit>=1.30.0",
    "rich>=13.0.0",
    "OCP>=7.7.2",
    "tqdm>=4.66.0",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
cadgcl = "src.cli:app"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"